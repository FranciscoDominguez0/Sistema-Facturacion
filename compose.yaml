services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vigifact_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-Sistema-Facturacion}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-12345678}
    volumes:
      - ./:/var/www/html
      - vigifact_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vigifact_network
    ports:
      - "127.0.0.1:9000:9000"


  db:
    image: postgres:15-alpine
    container_name: vigifact_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-Sistema-Facturacion}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345678}
    ports:
      # SEGURIDAD: Vinculado EXCLUSIVAMENTE a 127.0.0.1 (localhost del host).
      # No abre puertos a la red pública; solo accesible mediante túnel SSH:
      # Ejemplo: ssh -L 5432:127.0.0.1:5432 usuario@tu-servidor
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - vigifact_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vigifact_network

networks:
  vigifact_network:
    driver: bridge

volumes:
  vigifact_db_data:
  vigifact_storage:
